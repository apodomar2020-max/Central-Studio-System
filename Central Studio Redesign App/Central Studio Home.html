<style>
  /* COMPAT BRIDGE — bundle's Button/Input reference an older gold/gray
     token vocabulary; map onto the live cyan + ink theme. */
  :root {
    --color-gold-500: var(--cs-cyan-500); --color-gold-600: var(--cs-cyan-600);
    --color-black: var(--cs-ink-900); --color-white: var(--cs-white);
    --color-gray-100: var(--cs-ink-100); --color-gray-300: var(--cs-ink-200);
    --color-gray-600: var(--cs-ink-500); --color-gray-900: var(--cs-ink-900);
    --shadow-subtle: var(--shadow-sm); --shadow-medium: var(--shadow-md); --shadow-heavy: var(--shadow-lg);
    --radius-full: var(--radius-pill);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-body);
    background: radial-gradient(1200px 700px at 50% -10%, #14161b 0%, var(--cs-ink-950) 60%);
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; overflow: hidden;
  }
  #root { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }

  .cs-stage-backdrop { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
  .phone {
    position: relative; width: 390px; height: 844px; border-radius: 46px; overflow: hidden;
    background: var(--cs-ink-900);
    box-shadow: 0 50px 120px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.05);
    isolation: isolate;
  }
  @media (max-height: 880px) { .phone { transform: scale(0.92); } }
  @media (max-height: 800px) { .phone { transform: scale(0.84); } }
  @media (max-height: 720px) { .phone { transform: scale(0.74); } }

  .ios-status {
    position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 60;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 30px 0; font-family: var(--font-body); font-weight: 700; font-size: 15px;
    letter-spacing: 0.02em; pointer-events: none; color: #fff;
  }
  .ios-status .right { display: flex; align-items: center; gap: 7px; }
  .home-indicator {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; border-radius: 3px; z-index: 60; background: rgba(255,255,255,0.85);
  }

  /* image-slot dark-theme legibility (style exposed shadow parts) */
  image-slot::part(frame) { background: rgba(255,255,255,0.045); }
  image-slot::part(empty) { color: rgba(255,255,255,0.46); }
  image-slot::part(ring)  { border-color: rgba(255,255,255,0.18); }

  /* scroll areas */
  .feed { position: absolute; inset: 0 0 0 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .feed::-webkit-scrollbar { width: 0; }
  .hscroll { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .hscroll::-webkit-scrollbar { display: none; }
  .snap { scroll-snap-align: start; flex: 0 0 auto; }

  .rise { animation: rise 520ms var(--timing-ease-stage) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  .tab-pop { animation: tabPop 240ms var(--timing-ease-out) both; }
  @keyframes tabPop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  @media (prefers-reduced-motion: reduce) { .rise, .tab-pop { animation: none !important; } }
  button { font-family: inherit; }
</style>

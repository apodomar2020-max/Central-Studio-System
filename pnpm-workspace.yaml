# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# INTENT: require that any npm package version must have been published for
# at least 1 day (1440 minutes) before pnpm will allow installing it, as a
# defense against a compromised-maintainer/malicious-release supply-chain
# attack landing inside an already-permitted semver range.
#
# CURRENT STATUS (Security-05B2): ACTIVE. This workspace is pinned to
# pnpm@10.34.5 (see root package.json's "packageManager" field), which
# supports `minimumReleaseAge` (introduced in pnpm 10.16) and enforces it.
# 1440 minutes = a 24-hour maturity delay applied to any package version
# that pnpm has to newly resolve (a version not already pinned in the
# committed lockfile) — e.g. `pnpm add`, `pnpm update`, or any install that
# needs to pick a version for a range not yet satisfied by the lockfile.
#
# IMPORTANT SCOPE LIMIT: this control does NOT retroactively vet or protect
# against a malicious package version that is already committed into the
# current pnpm-lock.yaml. A normal `pnpm install --frozen-lockfile`
# deployment (which is what every production build path — Railway, EAS,
# Vercel — actually runs) installs exactly what the lockfile already
# specifies and does not re-evaluate package release age at all. This
# setting only guards the moment a new/updated version is being resolved
# into the lockfile in the first place, not what happens afterward.
#
# Do not disable this or set it to 0 without equivalent justification, since
# it is a real, active control. If a package must be installed before its
# release-age window has passed (e.g. an urgent security bugfix), add it to
# the `minimumReleaseAgeExclude` allowlist below — only for packages from
# trusted organizations with an impeccable security posture (e.g. Replit
# packages, react from Meta, typescript from Microsoft) — and remove the
# exclusion once the window has passed. The current exclusions below
# (`@replit/*`, `stripe-replit-sync`) are intentional, documented exceptions
# for exactly that reason, not an oversight.
#
# Example:
#   minimumReleaseAgeExclude:
#     - react
#     - typescript
#
# ============================================================================
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  # Exclude @replit scoped packages from the minimum release age check.
  # These are published by Replit and trusted — the supply-chain attack vector
  # this setting guards against does not apply to our own packages.
  - '@replit/*'
  - stripe-replit-sync

packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

catalog:
  '@replit/vite-plugin-cartographer': ^0.5.1
  '@replit/vite-plugin-dev-banner': ^0.1.1
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  # Must be this exact version because expo requires it
  react: 19.1.0
  # Must be this exact version because expo requires it
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: ^3.25.76

autoInstallPeers: false

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver


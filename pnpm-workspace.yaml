# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# INTENT: require that any npm package version must have been published for
# at least 1 day (1440 minutes) before pnpm will allow installing it, as a
# defense against a compromised-maintainer/malicious-release supply-chain
# attack landing inside an already-permitted semver range.
#
# CURRENT STATUS (Security-05A/05B1): NOT ACTIVE. `minimumReleaseAge` is a
# pnpm 10+ feature; this workspace is pinned to pnpm@9.15.9 (see root
# package.json's "packageManager" field), which does not recognize this key
# at all and silently ignores it — confirmed empirically (`pnpm config get
# minimumReleaseAge` returns undefined, and installs of just-published
# versions proceed with no warning). This setting currently provides ZERO
# protection. It is left in place, unmodified, as a statement of intent and
# so it takes effect automatically once the pnpm major version is upgraded
# (tracked separately as Security-05B2) — do not treat its presence here as
# evidence that release-age protection is active today.
#
# Once pnpm 10+ is adopted and this setting becomes live: do not disable it
# or set it to 0 without equivalent justification, since it will then be a
# real control. If a package must be installed before its release-age window
# has passed (e.g. an urgent security bugfix), add it to the
# `minimumReleaseAgeExclude` allowlist below — only for packages from
# trusted organizations with an impeccable security posture (e.g. Replit
# packages, react from Meta, typescript from Microsoft) — and remove the
# exclusion once the window has passed.
#
# Example:
#   minimumReleaseAgeExclude:
#     - react
#     - typescript
#
# ============================================================================
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  # Exclude @replit scoped packages from the minimum release age check.
  # These are published by Replit and trusted — the supply-chain attack vector
  # this setting guards against does not apply to our own packages.
  - '@replit/*'
  - stripe-replit-sync

packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

catalog:
  '@replit/vite-plugin-cartographer': ^0.5.1
  '@replit/vite-plugin-dev-banner': ^0.1.1

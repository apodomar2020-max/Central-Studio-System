openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Central Studio & Stage Admin API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: dashboard
  - name: instructors
  - name: classes
  - name: schedules
  - name: pricePackages
  - name: bookings
  - name: students
  - name: heroItems
  - name: notifications
  - name: marketing
  - name: analytics
  - name: packageOrders
  - name: attendance
  - name: settings

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /settings/class-capacity:
    get:
      operationId: getClassCapacitySettings
      tags: [settings]
      summary: Get class capacity feature status
      responses:
        "200":
          description: Class capacity settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassCapacitySettings"

  /admin/settings/class-capacity:
    get:
      operationId: getAdminClassCapacitySettings
      tags: [settings]
      summary: Get admin class capacity settings
      responses:
        "200":
          description: Class capacity settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassCapacitySettings"
    patch:
      operationId: updateAdminClassCapacitySettings
      tags: [settings]
      summary: Update admin class capacity settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classCapacityEnabled]
              properties:
                classCapacityEnabled: { type: boolean }
                confirmOverCapacity: { type: boolean }
      responses:
        "200":
          description: Updated class capacity settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassCapacitySettings"
        "409":
          description: Over-capacity warning when re-enabling
          content:
            application/json:
              schema:
                type: object
                required: [error, message, overCapacityOccurrences]
                properties:
                  error: { type: string }
                  message: { type: string }
                  overCapacityOccurrences:
                    type: array
                    items:
                      $ref: "#/components/schemas/OverCapacityOccurrence"

  /admin/branches:
    get:
      operationId: listAdminBranches
      tags: [branches]
      summary: List all studio branches, including inactive branches
      responses:
        "200":
          description: Branch list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchListResponse" }
        "401": { description: Admin authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: Permission denied, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    post:
      operationId: createAdminBranch
      tags: [branches]
      summary: Create a studio branch
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateBranchBody" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Branch" } } } }
        "400": { description: Invalid request, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409": { description: Branch name conflict, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /admin/branches/{id}:
    get:
      operationId: getAdminBranch
      tags: [branches]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Branch, content: { application/json: { schema: { $ref: "#/components/schemas/Branch" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    patch:
      operationId: updateAdminBranch
      tags: [branches]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateBranchBody" } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Branch" } } } }
        "400": { description: Invalid request, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409": { description: Branch name conflict, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /admin/branches/{branchId}/rooms:
    get:
      operationId: listAdminBranchRooms
      tags: [branches]
      summary: List all rooms for a branch, including inactive rooms
      parameters: [{ name: branchId, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Room list, content: { application/json: { schema: { $ref: "#/components/schemas/RoomListResponse" } } } }
        "404": { description: Branch not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    post:
      operationId: createAdminBranchRoom
      tags: [branches]
      parameters: [{ name: branchId, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateRoomBody" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Room" } } } }
        "400": { description: Invalid request, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Branch not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409": { description: Room name conflict, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /admin/rooms/{id}:
    patch:
      operationId: updateAdminRoom
      tags: [branches]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateRoomBody" } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Room" } } } }
        "400": { description: Invalid request, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Room not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409": { description: Room name conflict, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /admin/schedule-location-options/branches:
    get:
      operationId: listScheduleLocationBranches
      tags: [branches]
      summary: List active Branches for authorized schedule editors
      responses:
        "200": { description: Active Branches, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ScheduleBranch" } } } } }
        "403": { description: Permission denied, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /admin/schedule-location-options/branches/{branchId}/rooms:
    get:
      operationId: listScheduleLocationRooms
      tags: [branches]
      summary: List active Rooms for an active Branch for authorized schedule editors
      parameters: [{ name: branchId, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Active Rooms, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ScheduleRoom" } } } } }
        "404": { description: Branch not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "422": { description: Branch inactive, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /instructors:
    get:
      operationId: listInstructors
      tags: [instructors]
      summary: List all instructors
      responses:
        "200":
          description: List of instructors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Instructor"
    post:
      operationId: createInstructor
      tags: [instructors]
      summary: Create instructor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInstructorBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instructor"

  /instructors/{id}:
    get:
      operationId: getInstructor
      tags: [instructors]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Instructor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instructor"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateInstructor
      tags: [instructors]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInstructorBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instructor"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteInstructor
      tags: [instructors]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /classes:
    get:
      operationId: listClasses
      tags: [classes]
      summary: List all classes
      responses:
        "200":
          description: List of classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Class"
    post:
      operationId: createClass
      tags: [classes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"

  /classes/{id}:
    get:
      operationId: getClass
      tags: [classes]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateClass
      tags: [classes]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClassBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteClass
      tags: [classes]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/calendar:
    get:
      operationId: listAdminCalendar
      tags: [schedules]
      summary: Projected calendar occurrences for class and ballet schedules over a date range
      description: >
        Read-only. Projects existing `schedules` and `ballet_schedules` rows into concrete
        occurrence instances between `from` and `to` (inclusive), reusing the same
        day-of-week/effective-date logic already used elsewhere — no new recurrence system.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }, description: "Range start (inclusive), YYYY-MM-DD" }
        - { name: to, in: query, required: true, schema: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }, description: "Range end (inclusive), YYYY-MM-DD" }
        - { name: branchId, in: query, required: false, schema: { type: integer } }
        - { name: roomId, in: query, required: false, schema: { type: integer } }
      responses:
        "200": { description: Projected calendar occurrences, content: { application/json: { schema: { $ref: "#/components/schemas/CalendarOccurrenceListResponse" } } } }
        "400": { description: Invalid date range, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { description: Admin authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: Permission denied, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /admin/calendar/occurrence-roster:
    get:
      operationId: getAdminCalendarOccurrenceRoster
      tags: [schedules]
      summary: Booking/attendance roster for one calendar occurrence
      description: >
        Read-only. Composes the schedule summary plus the exact bookings (and
        their attendance, if any) for a single occurrence — for the future
        Calendar operational Sheet (Phase 4A.2). Regular schedules are
        filtered by (scheduleId, occurrenceDate); Ballet has no per-occurrence
        booking model, so its roster is the schedule's total reserved
        bookings, matching GET /admin/calendar's own bookingCount semantics.
      parameters:
        - { name: source, in: query, required: true, schema: { type: string, enum: [class, ballet] } }
        - { name: scheduleId, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: occurrenceDate, in: query, required: true, schema: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }, description: "YYYY-MM-DD. Required for the query shape's consistency with GET /admin/calendar even though Ballet does not filter by it." }
      responses:
        "200": { description: Occurrence roster, content: { application/json: { schema: { $ref: "#/components/schemas/CalendarOccurrenceRosterResponse" } } } }
        "400": { description: Invalid or missing parameters, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { description: Admin authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: Permission denied, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Schedule not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /admin/calendar/resource-view:
    get:
      operationId: getAdminCalendarResourceView
      tags: [schedules]
      summary: Operational resource view for studio rooms on a given date
      description: >
        Read-only. Returns active room occurrences grouped by room for a single date,
        for the Calendar Resource View mode (Phase 4B). Only active schedules assigned to a branch
        AND room are included.
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }, description: "Date for resource view, YYYY-MM-DD" }
        - { name: branchId, in: query, required: false, schema: { type: integer } }
        - { name: roomId, in: query, required: false, schema: { type: integer } }
      responses:
        "200": { description: Resource view, content: { application/json: { schema: { $ref: "#/components/schemas/CalendarResourceViewResponse" } } } }
        "400": { description: Invalid parameters, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { description: Admin authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: Permission denied, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /admin/room-reservations:
    get:
      operationId: listRoomReservations
      tags: [schedules]
      summary: List studio room reservations
      parameters:
        - { name: branchId, in: query, required: false, schema: { type: integer } }
        - { name: roomId, in: query, required: false, schema: { type: integer } }
        - { name: date, in: query, required: false, schema: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" } }
        - { name: status, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: List of room reservations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RoomReservation" }
        "401": { description: Admin authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: Permission denied, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    post:
      operationId: createRoomReservation
      tags: [schedules]
      summary: Create a studio room reservation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRoomReservationBody" }
      responses:
        "201":
          description: Room reservation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomReservation" }
        "400": { description: Invalid parameters, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { description: Admin authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: Permission denied, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409": { description: Room schedule time conflict, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /admin/room-reservations/{id}:
    get:
      operationId: getRoomReservation
      tags: [schedules]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Room reservation details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomReservation" }
        "401": { description: Admin authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: Permission denied, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Room reservation not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    patch:
      operationId: updateRoomReservation
      tags: [schedules]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRoomReservationBody" }
      responses:
        "200":
          description: Room reservation updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomReservation" }
        "400": { description: Invalid parameters, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { description: Admin authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: Permission denied, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Room reservation not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409": { description: Room schedule time conflict, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /schedules:
    get:
      operationId: listSchedules
      tags: [schedules]
      parameters:
        - { name: classId, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: List of schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Schedule"
    post:
      operationId: createSchedule
      tags: [schedules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScheduleBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"

  /schedules/{id}:
    get:
      operationId: getSchedule
      tags: [schedules]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateSchedule
      tags: [schedules]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScheduleBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSchedule
      tags: [schedules]
      description: Schedule hard deletion is prohibited. Cancel the schedule through the update endpoint instead.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "409":
          description: Schedule deletion is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/ballet/schedules:
    get:
      operationId: listAdminBalletSchedules
      tags: [ballet]
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20 } }
      responses:
        "200": { description: Ballet schedules, content: { application/json: { schema: { $ref: "#/components/schemas/BalletScheduleListResponse" } } } }
    post:
      operationId: createAdminBalletSchedule
      tags: [ballet]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateBalletScheduleBody" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/BalletScheduleMutationResponse" } } } }
        "422": { description: Invalid location or Ballet relationship, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /admin/ballet/schedules/{id}:
    patch:
      operationId: updateAdminBalletSchedule
      tags: [ballet]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateBalletScheduleBody" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/BalletScheduleMutationResponse" } } } }
        "422": { description: Invalid location or Ballet relationship, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /price-packages:
    get:
      operationId: listPricePackages
      tags: [pricePackages]
      responses:
        "200":
          description: List of price packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PricePackage"
    post:
      operationId: createPricePackage
      tags: [pricePackages]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePricePackageBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricePackage"

  /price-packages/{id}:
    get:
      operationId: getPricePackage
      tags: [pricePackages]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: PricePackage
          content:
            application/json:
              schema:

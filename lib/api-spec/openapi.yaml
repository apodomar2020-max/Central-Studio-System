          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePackageOrderBody"
      responses:
        "200":
          description: Updated package order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageOrder"
    delete:
      operationId: deletePackageOrder
      tags: [packageOrders]
      summary: Delete a package order
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /attendance:
    get:
      operationId: listAttendance
      tags: [attendance]
      summary: List attendance records
      parameters:
        - name: studentEmail
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: List of attendance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attendance"
    post:
      operationId: checkIn
      tags: [attendance]
      summary: Check in a student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInBody"
      responses:
        "201":
          description: Attendance record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendance"

  /attendance/stats:
    get:
      operationId: getAttendanceStats
      tags: [attendance]
      summary: Get attendance statistics
      parameters:
        - name: period
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Attendance stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceStats"


              schema: { $ref: "#/components/schemas/MyAttendanceResponse" }

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    DashboardSummary:
      type: object
      required:
        - totalUsers
        - totalStudents
        - totalParents
        - totalBookings
        - todayBookings
        - confirmedBookings
        - cancelledBookings
        - completedBookings
        - pendingPayments
        - refundedBookings
        - activeClasses
        - activeInstructors
        - pendingBookings
        - activePackages
        - pendingPackageOrders
        - totalCheckIns
        - todayCheckIns
        - missedAttendance
        - todayClasses
        - upcomingClasses
        - pendingCancellationRequests
        - activeBalletEnrollments
        - withdrawnBalletEnrollments
        - refundsUnderReview
        - completedFullRefunds
        - completedPartialRefunds
      properties:
        totalUsers: { type: integer }
        totalStudents: { type: integer }
        totalParents: { type: integer }
        totalBookings: { type: integer }
        todayBookings: { type: integer }
        confirmedBookings: { type: integer }
        cancelledBookings: { type: integer }
        completedBookings: { type: integer }
        pendingPayments: { type: integer }
        refundedBookings: { type: integer }
        activeClasses: { type: integer }
        activeInstructors: { type: integer }
        pendingBookings: { type: integer }
        activePackages: { type: integer }
        pendingPackageOrders: { type: integer }
        totalCheckIns: { type: integer }
        todayCheckIns: { type: integer }
        missedAttendance: { type: integer }
        todayClasses: { type: integer }
        upcomingClasses: { type: integer }
        pendingCancellationRequests: { type: integer }
        activeBalletEnrollments: { type: integer }
        withdrawnBalletEnrollments: { type: integer }
        refundsUnderReview: { type: integer }
        completedFullRefunds: { type: integer }
        completedPartialRefunds: { type: integer }

    Branch:
      type: object
      required: [id, name, code, isActive, roomCount, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        address: { type: ["string", "null"] }
        googleMapsLink: { type: ["string", "null"], format: uri }
        isActive: { type: boolean }
        roomCount: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
    BranchListResponse:
      type: array
      items: { $ref: "#/components/schemas/Branch" }
    CreateBranchBody:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        address: { type: ["string", "null"] }
        googleMapsLink: { type: ["string", "null"], format: uri }
        isActive: { type: boolean, default: true }
    UpdateBranchBody:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1 }
        address: { type: ["string", "null"] }
        googleMapsLink: { type: ["string", "null"], format: uri }
        isActive: { type: boolean }
    Room:
      type: object
      required: [id, branchId, name, code, isActive, createdAt, updatedAt]
      properties:
        id: { type: integer }
        branchId: { type: integer }
        name: { type: string }
        code: { type: string }
        isActive: { type: boolean }
        createdAt: { type: string }
        updatedAt: { type: string }
    RoomListResponse:
      type: array
      items: { $ref: "#/components/schemas/Room" }
    CreateRoomBody:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        isActive: { type: boolean, default: true }
    UpdateRoomBody:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1 }
        isActive: { type: boolean }

    Instructor:
      type: object
      required: [id, name, specialties, experienceYears, isActive, createdAt, achievements, professionalExperience]
      properties:
        id: { type: integer }
        name: { type: string }
        bio: { type: ["string", "null"] }
        photoUrl: { type: ["string", "null"] }
        specialties: { type: array, items: { type: string } }
        experienceYears: { type: integer }
        rating: { type: ["number", "null"] }
        isActive: { type: boolean }
        achievements: { type: array, items: { type: string } }
        professionalExperience: { type: array, items: { type: string } }
        teachingLevel: { type: ["string", "null"] }
        teachingPhilosophy: { type: ["string", "null"] }
        instagramUrl: { type: ["string", "null"] }
        tiktokUrl: { type: ["string", "null"] }
        youtubeUrl: { type: ["string", "null"] }
        createdAt: { type: string }

    CreateInstructorBody:
      type: object
      required: [name, specialties, experienceYears]
      properties:
        name: { type: string }
        bio: { type: ["string", "null"] }
        photoUrl: { type: ["string", "null"] }
        specialties: { type: array, items: { type: string } }
        experienceYears: { type: integer }
        rating: { type: ["number", "null"] }
        isActive: { type: boolean }
        achievements: { type: array, items: { type: string } }
        professionalExperience: { type: array, items: { type: string } }
        teachingLevel: { type: ["string", "null"] }
        teachingPhilosophy: { type: ["string", "null"] }
        instagramUrl: { type: ["string", "null"] }
        tiktokUrl: { type: ["string", "null"] }
        youtubeUrl: { type: ["string", "null"] }

    UpdateInstructorBody:
      type: object
      properties:
        name: { type: string }
        bio: { type: ["string", "null"] }
        photoUrl: { type: ["string", "null"] }
        specialties: { type: array, items: { type: string } }
        experienceYears: { type: integer }
        rating: { type: ["number", "null"] }
        isActive: { type: boolean }
        achievements: { type: array, items: { type: string } }
        professionalExperience: { type: array, items: { type: string } }
        teachingLevel: { type: ["string", "null"] }
        teachingPhilosophy: { type: ["string", "null"] }
        instagramUrl: { type: ["string", "null"] }
        tiktokUrl: { type: ["string", "null"] }
        youtubeUrl: { type: ["string", "null"] }

    PricingCategory:
      type: string
      enum: [adults, teens, kids]
      description: >
        General Class walk-in pricing bucket. Null/absent means the class has
        not been assigned a category yet, so the price resolver falls back to
        the legacy Studio-wide single price (see class-pricing settings).

    Class:
      type: object
      required: [id, title, category, level, ageGroup, allowAllAges, minAge, maxAge, durationMins, capacity, isActive, createdAt, ageRangeLabel, configurationState, catalogueEligibility]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: ["string", "null"] }
        instructorId: { type: ["integer", "null"] }
        category: { type: string }
        danceTypeId: { type: ["integer", "null"] }
        level: { type: string }
        ageGroup: { type: string }
        allowAllAges: { type: ["boolean", "null"] }
        minAge: { type: ["integer", "null"] }
        maxAge: { type: ["integer", "null"] }
        ageRangeLabel: { type: string }
        configurationState: { $ref: "#/components/schemas/CatalogueConfigurationState" }
        catalogueEligibility: { $ref: "#/components/schemas/CatalogueEligibility" }
        durationMins: { type: integer }
        capacity: { type: integer }
        photoUrl: { type: ["string", "null"] }
        classVideoUrl: { type: ["string", "null"] }
        isActive: { type: boolean }
        pricingCategory:
          oneOf: [{ $ref: "#/components/schemas/PricingCategory" }, { type: "null" }]
        createdAt: { type: string }

    CreateClassBody:
      type: object
      required: [title, category, level, durationMins, capacity]
      properties:
        title: { type: string }
        description: { type: ["string", "null"] }
        instructorId: { type: ["integer", "null"] }
        category: { type: string }
        danceTypeId: { type: ["integer", "null"] }
        level: { type: string }
        ageGroup: { type: string }
        allowAllAges: { type: ["boolean", "null"] }
        minAge: { type: ["integer", "null"] }
        maxAge: { type: ["integer", "null"] }
        durationMins: { type: integer }
        capacity: { type: integer }
        photoUrl: { type: ["string", "null"] }
        classVideoUrl: { type: ["string", "null"] }
        isActive: { type: boolean }
        pricingCategory:
          oneOf: [{ $ref: "#/components/schemas/PricingCategory" }, { type: "null" }]

    UpdateClassBody:
      type: object
      properties:
        title: { type: string }
        description: { type: ["string", "null"] }
        instructorId: { type: ["integer", "null"] }
        category: { type: string }
        danceTypeId: { type: ["integer", "null"] }
        level: { type: string }
        ageGroup: { type: string }
        allowAllAges: { type: ["boolean", "null"] }
        minAge: { type: ["integer", "null"] }
        maxAge: { type: ["integer", "null"] }
        durationMins: { type: integer }
        capacity: { type: integer }
        photoUrl: { type: ["string", "null"] }
        classVideoUrl: { type: ["string", "null"] }
        isActive: { type: boolean }
        pricingCategory:
          oneOf: [{ $ref: "#/components/schemas/PricingCategory" }, { type: "null" }]

    Schedule:
      type: object
      required: [id, classId, type, status, startTime, endTime, packageEligible, isRecurring, createdAt, allowAllAges, minAge, maxAge, ageRangeLabel, configurationState, catalogueEligibility]
      properties:
        id: { type: integer }
        classId: { type: integer }
        branchId: { type: ["integer", "null"] }
        roomId: { type: ["integer", "null"] }
        branch: { oneOf: [{ $ref: "#/components/schemas/ScheduleBranch" }, { type: "null" }] }
        room: { oneOf: [{ $ref: "#/components/schemas/ScheduleRoom" }, { type: "null" }] }
        type: { type: string, enum: [weekly, one_time] }
        status: { type: string, enum: [active, completed, expired, cancelled] }
        dayOfWeek: { type: ["integer", "null"] }
        date: { type: ["string", "null"] }
        startTime: { type: string }
        endTime: { type: string }
        priceEgp: { type: ["integer", "null"] }
        packageEligible: { type: boolean }
        location: { type: ["string", "null"] }
        isRecurring: { type: boolean }
        effectiveFrom: { type: ["string", "null"] }
        effectiveUntil: { type: ["string", "null"] }
        bookedCount: { type: integer }
        actualBookedCount: { type: integer }
        reservedSeatCount: { type: integer }
        currentOccurrenceDate: { type: ["string", "null"] }
        occurrenceDateUsedForEligibility: { type: ["string", "null"] }
        allowAllAges: { type: ["boolean", "null"] }
        minAge: { type: ["integer", "null"] }
        maxAge: { type: ["integer", "null"] }
        ageRangeLabel: { type: string }
        configurationState: { $ref: "#/components/schemas/CatalogueConfigurationState" }
        catalogueEligibility: { $ref: "#/components/schemas/CatalogueEligibility" }
        classCapacityEnabled: { type: boolean }
        capacityDisplayEnabled: { type: boolean }
        capacityEnforcementEnabled: { type: boolean }
        createdAt: { type: string }

    OverCapacityOccurrence:
      type: object
      required: [scheduleId, classId, classTitle, bookedCount, capacity]
      properties:
        scheduleId: { type: integer }
        classId: { type: integer }
        classTitle: { type: string }
        occurrenceDate: { type: ["string", "null"] }
        bookedCount: { type: integer }
        capacity: { type: integer }

    ClassCapacitySettings:
      type: object
      required: [id, classCapacityEnabled, enforcementEnabled, displayEnabled, overCapacityOccurrences, updatedAt]
      properties:
        id: { type: integer }
        classCapacityEnabled: { type: boolean }
        enforcementEnabled: { type: boolean }
        displayEnabled: { type: boolean }
        overCapacityOccurrences:
          type: array
          items:
            $ref: "#/components/schemas/OverCapacityOccurrence"
        updatedAt: { type: string }

    CreateScheduleBody:
      type: object
      required: [classId, branchId, roomId, startTime, endTime]
      properties:
        classId: { type: integer }
        branchId: { type: integer }
        roomId: { type: integer }
        dayOfWeek: { type: ["integer", "null"] }
        type: { type: string, enum: [weekly, one_time] }
        status: { type: string, enum: [active, completed, expired, cancelled] }
        date: { type: ["string", "null"] }
        priceEgp: { type: ["integer", "null"] }
        packageEligible: { type: boolean }
        startTime: { type: string }
        endTime: { type: string }
        location: { type: ["string", "null"] }
        isRecurring: { type: boolean }
        effectiveFrom: { type: ["string", "null"] }
        effectiveUntil: { type: ["string", "null"] }

    UpdateScheduleBody:
      type: object
      properties:
        classId: { type: integer }
        branchId: { type: ["integer", "null"] }
        roomId: { type: ["integer", "null"] }
        dayOfWeek: { type: ["integer", "null"] }
        type: { type: string, enum: [weekly, one_time] }
        status: { type: string, enum: [active, completed, expired, cancelled] }
        date: { type: ["string", "null"] }
        priceEgp: { type: ["integer", "null"] }
        packageEligible: { type: boolean }
        startTime: { type: string }
        endTime: { type: string }
        location: { type: ["string", "null"] }
        isRecurring: { type: boolean }
        effectiveFrom: { type: ["string", "null"] }
        effectiveUntil: { type: ["string", "null"] }

    ScheduleBranch:
      type: object
      required: [id, name, code, isActive]
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        address: { type: ["string", "null"] }
        googleMapsLink: { type: ["string", "null"], format: uri }
        isActive: { type: boolean }
    ScheduleRoom:
      type: object
      required: [id, branchId, name, code, isActive]
      properties:
        id: { type: integer }
        branchId: { type: integer }
        name: { type: string }
        code: { type: string }
        isActive: { type: boolean }

    CalendarOccurrence:
      type: object
      required: [scheduleId, source, scheduleType, occurrenceDate, startTime, endTime, branchName, roomName, conflict]
      properties:
        scheduleId: { type: integer }
        source: { type: string, enum: [class, ballet, reservation], description: "Which system this occurrence came from — generic Studio schedules, Ballet schedules, or Room Reservations." }
        scheduleType: { type: string, enum: [weekly, one_time] }
        occurrenceDate: { type: string, description: "YYYY-MM-DD, the concrete calendar date this projected occurrence falls on." }
        startTime: { type: string }
        endTime: { type: string }
        classId: { type: ["integer", "null"] }
        classTitle: { type: ["string", "null"] }
        title: { type: ["string", "null"] }
        instructorId: { type: ["integer", "null"] }
        instructorName: { type: ["string", "null"] }
        branchName: { type: ["string", "null"] }
        roomName: { type: ["string", "null"] }
        capacity: { type: ["integer", "null"] }
        bookingCount: { type: ["integer", "null"] }
        reservationType: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        organizerName: { type: ["string", "null"] }
        organizerContact: { type: ["string", "null"] }
        conflict:
          description: "Present when this occurrence overlaps another active occurrence in the same branch+room on this date, computed server-side."
          oneOf:
            - { type: "null" }
            - $ref: "#/components/schemas/CalendarOccurrenceConflict"
    CalendarOccurrenceConflict:
      type: object
      required: [scheduleId, source, startTime, endTime, branchName, roomName]
      properties:
        scheduleId: { type: integer }
        source: { type: string, enum: [class, ballet, reservation] }
        classTitle: { type: ["string", "null"] }
        startTime: { type: string }
        endTime: { type: string }
        branchName: { type: ["string", "null"] }
        roomName: { type: ["string", "null"] }
    CalendarOccurrenceListResponse:
      type: array
      items: { $ref: "#/components/schemas/CalendarOccurrence" }

    CalendarOccurrenceRosterItem:
      type: object
      required: [bookingId, studentName, participantName, bookingStatus, paymentStatus, attendanceStatus, checkedInAt]
      properties:
        bookingId: { type: integer }
        studentName: { type: string, description: "Account-owner identity — the linked student's name, falling back to the name captured on the booking itself for legacy/unlinked rows. Never null." }

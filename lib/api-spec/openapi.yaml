openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Central Studio & Stage Admin API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: dashboard
  - name: instructors
  - name: classes
  - name: schedules
  - name: pricePackages
  - name: bookings
  - name: students
  - name: heroItems
  - name: notifications
  - name: marketing
  - name: analytics
  - name: packageOrders
  - name: attendance
  - name: settings

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /settings/class-capacity:
    get:
      operationId: getClassCapacitySettings
      tags: [settings]
      summary: Get class capacity feature status
      responses:
        "200":
          description: Class capacity settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassCapacitySettings"

  /admin/settings/class-capacity:
    get:
      operationId: getAdminClassCapacitySettings
      tags: [settings]
      summary: Get admin class capacity settings
      responses:
        "200":
          description: Class capacity settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassCapacitySettings"
    patch:
      operationId: updateAdminClassCapacitySettings
      tags: [settings]
      summary: Update admin class capacity settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classCapacityEnabled]
              properties:
                classCapacityEnabled: { type: boolean }
                confirmOverCapacity: { type: boolean }
      responses:
        "200":
          description: Updated class capacity settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassCapacitySettings"
        "409":
          description: Over-capacity warning when re-enabling
          content:
            application/json:
              schema:
                type: object
                required: [error, message, overCapacityOccurrences]
                properties:
                  error: { type: string }
                  message: { type: string }
                  overCapacityOccurrences:
                    type: array
                    items:
                      $ref: "#/components/schemas/OverCapacityOccurrence"


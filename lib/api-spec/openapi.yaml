  # Website CMS Wave 1 — Backgrounds only. No News/Performance paths in this
  # wave (see the Wave 1 report). Fixed set of 8 section keys — there is
  # deliberately no POST (create) or DELETE path: rows are seeded once
  # (scripts/src/seedWebsiteBackgrounds.ts) and only ever updated afterward.
  /website/backgrounds:
    get:
      operationId: listPublicWebsiteBackgrounds
      tags: [websiteBackgrounds]
      summary: List public website background media (public projection only)
      responses:
        "200":
          description: The 8 approved sections' current background media
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicWebsiteBackgroundSetting"

  /admin/website/backgrounds:
    get:
      operationId: listAdminWebsiteBackgrounds
      tags: [websiteBackgrounds]
      summary: List all website background sections (Admin)
      responses:
        "200":
          description: The 8 approved sections, full Admin shape
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebsiteBackgroundSetting"

  /admin/website/backgrounds/{sectionKey}:
    patch:
      operationId: updateWebsiteBackground
      tags: [websiteBackgrounds]
      summary: Set or clear a website section's background media URL
      parameters:
        - { name: sectionKey, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWebsiteBackgroundBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteBackgroundSetting"
        "400":
          description: Invalid section key or media URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown section key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

